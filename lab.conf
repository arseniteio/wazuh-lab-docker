# lab.conf · ENSFácil lab settings.
# To change something only on your machine, create lab.conf.local (ignored by
# git) with the variables you want to override.

# Compose project name: prefix of containers, volumes and network.
# Must differ from any other Wazuh you have running.
COMPOSE_PROJECT_NAME="ensfacil-lab"

# Wazuh version: the same for the three images and the agent.
WAZUH_VERSION="4.14.7"

# Code under test. The lab never writes to these folders.
PLUGIN_SRC="/Users/diqueran/Documents/Proyectos/Quersystem/OSCompilance/ensfacil"
RUNBOOKS_DIR="/Users/diqueran/Documents/Proyectos/Quersystem/Wazuh/ENS-Desarrollo"

# OSCompliance monorepo: the agent is built from agent/, the manager rules
# come from catalog/wazuh/.
CORE_SRC="/Users/diqueran/Documents/Proyectos/Quersystem/OSCompilance/oscompliance-core"

# Linux runbooks to install (folder names inside RUNBOOKS_DIR).
RUNBOOKS="op.acc.1-identification"

# Controls seeded into the plugin configuration.
CONTROLS="mp.info.6 op.acc.1 op.acc.2 op.acc.3 op.acc.4 op.acc.5 op.acc.6 op.exp.1 op.exp.2 op.exp.3 op.exp.4 op.exp.5 op.exp.6 op.exp.7 op.exp.8 op.exp.9 op.exp.10 op.mon.1 op.mon.2 op.mon.3 op.nub.1 op.cont.2 op.cont.3"

# Image that builds the plugin (ci/osd-builder.Dockerfile in the plugin repo).
OSD_BUILDER_IMAGE="ensfacil-osd-builder:2.19.5"

# Dashboard port on your Mac: https://localhost:8443
DASHBOARD_PORT="8443"

# LAB-ONLY credentials: the wazuh-docker sample ones.
# Never use these in a real environment.
INDEXER_PASSWORD="SecretPassword"
API_PASSWORD="MyS3cr37P450r.*-"
