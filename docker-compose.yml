# ENSFácil lab: single-node Wazuh + one Linux agent running oscompliance-agent.
#
# Based on the official wazuh-docker v4.14.7 single-node docker-compose.yml with
# three changes, each explained where it happens:
#   1. The dashboard and the manager use their own images (images/).
#   2. Only the dashboard is published, and only on 127.0.0.1: everything else
#      talks over the compose network, so it never clashes with another Wazuh.
#   3. An agent-01 service: Ubuntu with wazuh-agent and oscompliance-agent.
#
# Not meant to be used by hand: `make up` and `make down` (see README).

services:
  wazuh.manager:
    build:
      context: images/manager
      args:
        WAZUH_VERSION: ${WAZUH_VERSION}
    image: ensfacil-lab/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    # (1) Official + the ENSFácil zip installed (guide 06 §3).
    build:
      context: images/dashboard
      args:
        WAZUH_VERSION: ${WAZUH_VERSION}
        ENSFACIL_VERSION: ${ENSFACIL_VERSION}
    image: ensfacil-lab/wazuh-dashboard-ensfacil:${ENSFACIL_VERSION}
    hostname: wazuh.dashboard
    restart: unless-stopped
    # (2) Only on your Mac, on a port no other Wazuh uses.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT}:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - ./certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager

  # (3) Audited machine: Ubuntu with wazuh-agent, in the ens group, running
  # oscompliance-agent from build/oscompliance.
  agent-01:
    build:
      context: images/agent
      args:
        WAZUH_VERSION: ${WAZUH_VERSION}
    image: ensfacil-lab/wazuh-agent:${WAZUH_VERSION}
    hostname: lab-agent-01
    restart: unless-stopped
    volumes:
      # oscompliance-agent built by scripts/build-core.sh.
      - ./build/oscompliance:/opt/oscompliance:ro
      # Agent identity (client.keys) and configuration: survives recreating
      # the container, as on a real machine. Without it, a recreated agent
      # clashes with its own name on the manager.
      - agent01_ossec_etc:/var/ossec/etc
    depends_on:
      - wazuh.manager
    # The agent only starts once the manager has the ens group and the rules:
    # scripts/up.sh starts it in its own step, not plain `docker compose up`.
    profiles: [agents]

  # (4) OSCompliance engine: reads the facts from the indexer, judges them and
  # writes verdicts to the oscompliance-verdicts index. Binary built by
  # scripts/build-core.sh; one pass every 5 minutes.
  engine:
    image: alpine:3.20
    restart: unless-stopped
    entrypoint: ["/opt/oscompliance/oscompliance-engine"]
    command: ["-indexer", "https://wazuh.indexer:9200", "-ca", "/certs/root-ca.pem", "-interval", "5m"]
    environment:
      - OSC_INDEXER_PASSWORD=${INDEXER_PASSWORD}
    volumes:
      - ./build/oscompliance:/opt/oscompliance:ro
      - ./certs:/certs:ro
    depends_on:
      - wazuh.indexer

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  agent01_ossec_etc:
